<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Start your story | Rob Brough</title>
<meta name="description" content="A 5-minute story quiz. Every answer builds the outline of your business documentary.">
<link rel="stylesheet" href="css/style.css">
<style>
body { min-height: 100svh; }
.app { display: grid; grid-template-columns: 1fr 460px; min-height: 100svh; }
.app.is-start, .app.is-done { grid-template-columns: 1fr; }

.q-side { display: flex; flex-direction: column; padding: 28px var(--gutter) 56px; }
.q-top { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.q-top .logo { font-size: 48px; }
.q-count { font-size: 15px; color: var(--slate); }
.progress { display: flex; gap: 6px; padding-top: 28px; }
.progress i { flex: 1; height: 3px; background: var(--sand); position: relative; overflow: hidden; }
.progress i::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease); }
.progress i.on::after { transform: none; }

.stage { position: relative; flex: 1; padding-top: 72px; max-width: 820px; }
.q { display: flex; flex-direction: column; gap: 24px; }
.q.enter { animation: q-in .35s var(--ease) both; }
.q.leave { animation: q-out .25s ease both; }
.q.back.enter { animation-name: q-in-back; }
@keyframes q-in { from { opacity: 0; transform: translateX(16px); } }
@keyframes q-out { to { opacity: 0; transform: translateX(-16px); } }
@keyframes q-in-back { from { opacity: 0; transform: translateX(-16px); } }

.q__beat { font-size: 15px; color: var(--slate); }
.q h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(34px, 3.6vw, 52px); line-height: 1.15; letter-spacing: -.015em; max-width: 740px; }
.q__hint { font-size: 16px; color: var(--slate); max-width: 640px; }
textarea, input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date] { width: 100%; max-width: 720px; font: inherit; font-size: 17px; color: var(--ink); background: var(--white); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; transition: border-color .2s; }
textarea { min-height: 170px; resize: vertical; line-height: 1.6; }
textarea:focus, input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
input[type=number] { max-width: 200px; }
.label { font-size: 14px; font-weight: 600; }

.pills { display: flex; flex-wrap: wrap; gap: 12px; max-width: 780px; }
.pill { padding: 14px 22px; border: 1px solid var(--line); background: var(--white); border-radius: 999px; font-size: 16px; transition: background-color .15s var(--ease), color .15s var(--ease), border-color .15s; }
.pill:hover { border-color: var(--ink); }
.pill[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--white); }

.q-actions { display: flex; gap: 24px; align-items: center; padding-top: 36px; flex-wrap: wrap; }
.q-actions .link { color: var(--slate); font-weight: 500; }
.btn[disabled] { opacity: .4; cursor: default; }

/* Start screen */
.paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; max-width: 1280px; }
.path { text-align: left; display: flex; flex-direction: column; gap: 12px; padding: 32px; background: var(--white); border: 1px solid var(--sand); border-radius: var(--radius); transition: border-color .2s, box-shadow .2s; }
.path:hover { border-color: var(--ink); }
.path[aria-pressed=true] { border: 2px solid var(--ink); padding: 31px; }
.path b { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.2; }
.app.is-start .stage, .app.is-done .stage { max-width: none; }

/* Story so far */
.story { background: var(--ink); color: var(--white); padding: 56px 48px; display: flex; flex-direction: column; gap: 28px; position: sticky; top: 0; height: 100svh; overflow-y: auto; }
.app.is-start .story, .app.is-done .story { display: none; }
.story__head b { display: block; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.2; }
.story__head span { font-size: 14px; color: rgba(255,255,255,.65); }
.beats { border-top: 1px solid rgba(255,255,255,.2); }
.sbeat { padding-block: 18px; border-bottom: 1px solid rgba(255,255,255,.2); display: flex; flex-direction: column; gap: 6px; }
.sbeat > span { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.45); transition: color .4s var(--ease); }
.sbeat.has > span { color: rgba(255,255,255,.65); }
.sbeat.now > span { color: var(--white); }
.sbeat p { font-family: var(--serif); font-size: 18px; line-height: 1.4; }
.sbeat p .w { opacity: 0; animation: word .4s var(--ease) forwards; }
@keyframes word { to { opacity: 1; } }
.sbeat em { font-family: var(--serif); font-size: 18px; color: rgba(255,255,255,.8); }

/* Done screen */
.done { display: grid; grid-template-columns: 520px 1fr; gap: 96px; align-items: start; }
.done h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(44px, 4.8vw, 68px); line-height: 1.08; letter-spacing: -.02em; }
.done__left { display: flex; flex-direction: column; gap: 24px; }
.fields { display: flex; flex-direction: column; gap: 10px; }
.fields .row { display: flex; gap: 10px; }
.outline-card { background: var(--white); border-radius: var(--radius); padding: 40px; animation: card-in .7s var(--ease) .15s both; }
@keyframes card-in { from { opacity: 0; transform: translateX(40px); } }
.outline-card h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.2; padding-bottom: 16px; }
.orow { display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding-block: 14px; border-top: 1px solid var(--sand); }
.orow b { font-size: 13px; color: var(--slate); }
.orow span { font-size: 15px; line-height: 1.55; }
.orow span.empty { color: var(--slate); font-style: italic; }
.sent { display: none; }
.is-sent .sent { display: flex; }
.is-sent .unsent { display: none; }
.note { font-size: 13px; color: var(--slate); }

@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; }
  .story { position: static; height: auto; padding: 40px var(--gutter); }
  .paths { grid-template-columns: 1fr; }
  .done { grid-template-columns: 1fr; gap: 48px; }
}
@media (max-width: 600px) {
  .q-top .logo { font-size: 40px; }
  .stage { padding-top: 40px; }
  .orow { grid-template-columns: 1fr; gap: 4px; }
  .fields .row { flex-direction: column; }
  .q-actions .btn { width: 100%; }
}
</style>
</head>
<body>
<div class="app is-start" id="app">
  <section class="q-side">
    <div class="q-top">
      <a href="index.html" class="logo" aria-label="Back to the home page">Rob Brough</a>
      <span class="q-count" id="count">Saved as you go</span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="stage" id="stage" aria-live="polite"></div>
  </section>
  <aside class="story" aria-label="Your story so far">
    <div class="story__head"><b>Your story so far</b><span>This outline builds as you answer. Rob reads it before he calls.</span></div>
    <div class="beats" id="beats"></div>
  </aside>
</div>

<script>
(function () {
  var BEATS = ['The hero and what they wanted', 'The problem that made it hard', 'The guide who backed them', 'How they did it', 'Where they are now'];

  // Every question maps to a beat (0-4) or to filming / fit (null), so the answers are the outline.
  var QUESTIONS = {
    legacy: [
      { id: 'year', beat: 0, type: 'number', q: 'What year did it all start?', hint: 'Roughly is fine.', ph: 'e.g. 1986' },
      { id: 'founder', beat: 0, type: 'text', q: 'Tell us about the person who started it. What were they trying to build?', hint: 'Who they were, where they started, what they had to begin with.' },
      { id: 'runs', say: 'Run today by: ', beat: 0, type: 'one', q: 'Who runs it today?', options: ['The founder', 'Second generation', 'Third generation or more', 'New owners who bought in'] },
      { id: 'hardest', beat: 1, type: 'text', q: 'Tell us about the hardest time the business has been through.', hint: 'A flood, a recession, losing a big customer, a health scare. A few lines is plenty. The details come out when you talk to Rob.' },
      { id: 'nearly', say: "Nearly didn't survive: ", beat: 1, type: 'one', q: "Was there a moment it nearly didn't make it?", options: ['Yes, once', 'More than once', 'Not really'] },
      { id: 'helped', say: 'Helped through by: ', beat: 2, type: 'many', q: 'Who helped you get through it?', hint: 'Choose as many as you like. These are often the voices that make the film.', options: ['Family', 'A long-serving staff member', 'A mentor', 'A loyal customer', 'A supplier or the bank', 'The local community'], extra: 'Is there one person Rob should talk to? (optional)', extraPh: 'Name and how they helped' },
      { id: 'turned', beat: 3, type: 'text', q: 'What decision or change turned things around?', hint: 'A new product, a risk you took, a move, a person you hired.' },
      { id: 'proud', beat: 4, type: 'text', q: 'What are you proudest of today?' },
      { id: 'next', say: 'Coming up: ', beat: 4, type: 'many', q: "What's coming up for the business?", hint: 'This tells Rob why now.', options: ['An anniversary or milestone', 'Handing over to the next generation', 'Growing or a new site', 'Hiring good people', 'We just want it recorded'] },
      { id: 'archive', beat: null, type: 'one', q: 'Do you have old photos, footage or objects from the early days?', hint: 'Old material brings memories back on camera.', options: ['Boxes of them', 'A few', 'Not really'] },
      { id: 'oncamera', beat: null, type: 'many', q: 'Who would you want on camera?', options: ['The founder', 'Family', 'Long-serving staff', 'Customers', 'People from the community'] },
      { id: 'date', beat: null, type: 'date', q: "Is there a date you'd like it ready by?", hint: 'Leave it blank if there is no date yet.' }
    ],
    builtwith: [
      { id: 'provide', beat: null, type: 'text', q: 'What does your business provide, and to which kinds of businesses?', hint: 'e.g. we supply machinery to farmers and contractors.', short: true },
      { id: 'customer', beat: 0, type: 'text', q: "Think of a customer you're proud of helping. Who are they, and what were they trying to achieve?" },
      { id: 'blocker', beat: 1, type: 'text', q: 'What was standing in their way before they worked with you?', hint: 'Cash flow, old equipment, no time, a market that changed.' },
      { id: 'further', beat: 2, type: 'text', q: 'Tell us about a time you went further for them than they expected.', hint: 'This is the moment the film is really about.' },
      { id: 'changed', say: 'What changed: ', beat: 3, type: 'many', q: 'What changed for them?', options: ['Grew sales', 'Opened a new site', 'Took on more staff', 'Won bigger work', 'Got through a tough patch'], extra: "A number they'd be happy to share (optional)", extraPh: 'e.g. doubled their fleet in three years' },
      { id: 'camera', say: 'Happy to go on camera: ', beat: 4, type: 'one', q: 'Would they be happy to go on camera?', options: ["Yes, I've asked", 'Probably', "I'd need to ask"] },
      { id: 'howmany', beat: null, type: 'one', q: 'How many customer stories like this could you tell?', hint: 'A series has six.', options: ['1 or 2', '3 to 5', '6 or more'] },
      { id: 'use', beat: null, type: 'many', q: 'Where would you use the films?', options: ['Website', 'Sales meetings', 'Social media', 'Ads', 'Events and trade shows', 'Recruiting'] },
      { id: 'signoff', beat: null, type: 'one', q: 'Who signs off on marketing like this?', hint: 'Helps Rob prepare the right pitch.', options: ['Me', 'Me and the owner or CEO', 'A committee or head office'] },
      { id: 'when', beat: null, type: 'one', q: 'When would you like the first episode?', options: ['This quarter', 'Next quarter', 'Just exploring'] }
    ]
  };

  var KEY = 'rb-story-quiz';
  var state = load() || { path: null, unsure: false, i: -1, a: {} };
  var params = new URLSearchParams(location.search);
  if (!state.path && params.get('path') && QUESTIONS[params.get('path')]) state.path = params.get('path');

  var app = document.getElementById('app'), stage = document.getElementById('stage');
  var progress = document.getElementById('progress'), count = document.getElementById('count'), beatsEl = document.getElementById('beats');

  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function qs() { return QUESTIONS[state.path] || []; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

  // ---------- Story panel ----------
  function summary(beat) {
    var parts = [];
    qs().forEach(function (q) {
      if (q.beat !== beat) return;
      var v = state.a[q.id];
      if (!v) return;
      if (q.id === 'year') parts.push('Started in ' + v + '.');
      else if (Array.isArray(v.picks)) {
        if (v.picks.length) parts.push((q.say || '') + v.picks.map(function (p) { return q.say ? p.replace(/^./, function (c) { return c.toLowerCase(); }) : p; }).join(', ') + '.');
        if (v.extra) parts.push(v.extra.trim().replace(/\.?$/, '.'));
      } else if (q.say) parts.push(q.say + String(v).replace(/^./, function (c) { return c.toLowerCase(); }) + '.');
      else parts.push(String(v).trim().replace(/\.?$/, '.'));
    });
    return parts.join(' ');
  }

  function renderStory(changedBeat) {
    var current = qs()[state.i] ? qs()[state.i].beat : null;
    beatsEl.innerHTML = '';
    BEATS.forEach(function (name, b) {
      var text = summary(b);
      var node = el('<div class="sbeat"><span>' + (b + 1) + '. ' + name + '</span></div>');
      if (text) {
        node.classList.add('has');
        var p = document.createElement('p');
        if (b === changedBeat) {
          // the new answer writes itself in, word by word
          p.innerHTML = text.split(' ').map(function (w, k) { return '<span class="w" style="animation-delay:' + (k * 35) + 'ms">' + esc(w) + '</span>'; }).join(' ');
        } else p.textContent = text;
        node.appendChild(p);
      }
      if (b === current) { node.classList.add('now'); if (!text) node.appendChild(el('<em>Writing now…</em>')); }
      beatsEl.appendChild(node);
    });
  }

  function renderProgress() {
    var n = qs().length;
    progress.innerHTML = '';
    for (var k = 0; k < n; k++) { var i = document.createElement('i'); if (k <= state.i) i.className = 'on'; progress.appendChild(i); }
    count.textContent = state.i >= 0 && state.i < n ? 'Question ' + (state.i + 1) + ' of ' + n : 'Saved as you go';
  }

  // ---------- Screens ----------
  function swap(node, back) {
    var old = stage.firstChild;
    var put = function () {
      stage.innerHTML = ''; node.classList.add('enter'); if (back) node.classList.add('back');
      stage.appendChild(node);
      var f = node.querySelector('textarea, input, .pill, .path'); if (f && window.innerWidth > 600) f.focus({ preventScroll: true });
    };
    if (old && old.classList) { old.classList.add('leave'); setTimeout(put, 220); } else put();
  }

  function startScreen() {
    app.className = 'app is-start';
    progress.innerHTML = '';
    count.textContent = 'About 5 minutes';
    var opts = [
      ['legacy', false, 'How my business was built', 'The Legacy film. For owners of businesses that have run 20 years or more.'],
      ['builtwith', false, 'How we helped our customers grow', 'The Built with series. For businesses whose customers are businesses.'],
      ['legacy', true, "I'm not sure yet", 'Start with your own story. Rob will help you work out the best fit.']
    ];
    var node = el('<div class="q"><span class="q__beat">The story quiz, about 5 minutes</span><h1 style="font-size:clamp(40px,5vw,72px);max-width:860px">What story would you like to tell?</h1><p class="q__hint">Answer as much or as little as you like. Each answer adds to your story outline, which Rob reads before he calls you.</p><div class="paths" role="group" aria-label="Choose a story"></div><div class="q-actions"><button class="btn btn--ink" id="go" disabled>Start my story</button></div></div>');
    var wrap = node.querySelector('.paths'), go = node.querySelector('#go');
    opts.forEach(function (o) {
      var b = el('<button class="path" aria-pressed="false"><b>' + o[2] + '</b><span class="small muted">' + o[3] + '</span></button>');
      var picked = state.path === o[0] && state.unsure === o[1];
      if (picked) { b.setAttribute('aria-pressed', 'true'); go.disabled = false; }
      b.addEventListener('click', function () {
        wrap.querySelectorAll('.path').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
        if (state.path !== o[0]) state.a = {};
        state.path = o[0]; state.unsure = o[1]; go.disabled = false; save();
      });
      wrap.appendChild(b);
    });
    go.addEventListener('click', function () { state.i = 0; save(); question(false); });
    swap(node);
  }

  function question(back, changedBeat) {
    var q = qs()[state.i];
    if (!q) return doneScreen();
    app.className = 'app';
    var v = state.a[q.id];
    var label = q.beat === null ? (q.type === 'date' || q.id === 'when' ? 'Timing' : 'Filming and fit') : 'Beat ' + (q.beat + 1) + ': ' + BEATS[q.beat];
    var node = el('<div class="q"><span class="q__beat">' + label + '</span><h1>' + esc(q.q) + '</h1>' + (q.hint ? '<p class="q__hint">' + esc(q.hint) + '</p>' : '') + '<div class="field"></div><div class="q-actions"><button class="btn btn--ink" id="next">' + (state.i === qs().length - 1 ? 'See my story' : 'Next question') + '</button><button class="link" id="skip">Skip this one</button><button class="link" id="back">Back</button></div></div>');
    var field = node.querySelector('.field');

    if (q.type === 'text') field.appendChild(el('<textarea aria-label="Your answer"' + (q.short ? ' style="min-height:110px"' : '') + '>' + esc(v || '') + '</textarea>'));
    if (q.type === 'number') field.appendChild(el('<input type="number" inputmode="numeric" min="1850" max="2026" aria-label="Year" placeholder="' + q.ph + '" value="' + esc(v || '') + '">'));
    if (q.type === 'date') field.appendChild(el('<input type="date" aria-label="Date" style="max-width:280px" value="' + esc(v || '') + '">'));
    if (q.type === 'one' || q.type === 'many') {
      var picks = q.type === 'one' ? (v ? [v] : []) : (v && v.picks) || [];
      var group = el('<div class="pills" role="group" aria-label="Options"></div>');
      q.options.forEach(function (o) {
        var b = el('<button class="pill" aria-pressed="' + (picks.indexOf(o) > -1) + '">' + esc(o) + '</button>');
        b.addEventListener('click', function () {
          if (q.type === 'one') group.querySelectorAll('.pill').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
          if (q.type === 'one') setTimeout(next, 260); // single tap moves on
        });
        group.appendChild(b);
      });
      field.appendChild(group);
      if (q.extra) field.appendChild(el('<div style="display:flex;flex-direction:column;gap:8px;padding-top:24px"><span class="label">' + esc(q.extra) + '</span><input type="text" style="max-width:520px" placeholder="' + esc(q.extraPh) + '" value="' + esc((v && v.extra) || '') + '"></div>'));
    }

    function read() {
      if (q.type === 'text') return node.querySelector('textarea').value.trim();
      if (q.type === 'number' || q.type === 'date') return node.querySelector('input').value.trim();
      var on = Array.prototype.map.call(node.querySelectorAll('.pill[aria-pressed=true]'), function (x) { return x.textContent; });
      if (q.type === 'one') return on[0] || '';
      var extra = node.querySelector('input[type=text]');
      return { picks: on, extra: extra ? extra.value.trim() : '' };
    }
    function next() {
      var val = read();
      var empty = !val || (val.picks && !val.picks.length && !val.extra);
      if (empty) delete state.a[q.id]; else state.a[q.id] = val;
      state.i++; save();
      question(false, empty ? null : q.beat);
    }
    node.querySelector('#next').addEventListener('click', next);
    node.querySelector('#skip').addEventListener('click', function () { state.i++; save(); question(false); });
    node.querySelector('#back').addEventListener('click', function () {
      var val = read(); if (val && !(val.picks && !val.picks.length && !val.extra)) state.a[q.id] = val;
      state.i--; save();
      if (state.i < 0) { state.i = -1; startScreen(); } else question(true);
    });
    node.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); next(); } });

    renderProgress();
    renderStory(changedBeat);
    swap(node, back);
  }

  function doneScreen() {
    app.className = 'app is-done';
    renderProgress(); count.textContent = 'Your outline is ready';
    var film = state.path === 'builtwith' ? 'The Built with series' : 'The Legacy film';
    var rows = BEATS.map(function (name, b) {
      var t = summary(b);
      return '<div class="orow"><b>' + name + '</b><span' + (t ? '' : ' class="empty"') + '>' + (t ? esc(t) : 'Rob will ask you about this one') + '</span></div>';
    }).join('');
    var node = el('<div class="done"><div class="done__left"><h1>Half your story is already written.</h1><p class="muted">Rob has your outline. He\'ll call to talk it through, find the parts worth filming and suggest the right package.</p>'
      + '<form class="unsent" id="send" style="display:flex;flex-direction:column;gap:24px"><div class="fields"><input type="text" name="name" placeholder="Your name" required aria-label="Your name"><input type="text" name="business" placeholder="Business name" aria-label="Business name"><div class="row"><input type="email" name="email" placeholder="Email" required aria-label="Email"><input type="tel" name="phone" placeholder="Phone" aria-label="Phone"></div></div>'
      + '<div style="display:flex;flex-direction:column;gap:12px"><span class="label">Best time for Rob to call</span><div class="pills" id="when"><button type="button" class="pill" aria-pressed="false">Morning</button><button type="button" class="pill" aria-pressed="true">Afternoon</button><button type="button" class="pill" aria-pressed="false">Email me first</button></div></div>'
      + '<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><button class="btn btn--ink" type="submit">Send my story to Rob</button><button type="button" class="link" id="edit">Change my answers</button></div><p class="note">Prototype: nothing is sent yet. Answers stay in this browser.</p></form>'
      + '<div class="sent" style="flex-direction:column;gap:16px"><p class="h3">Thanks. Rob has your story.</p><p class="muted">He\'ll be in touch soon. In the meantime, have a look through his films.</p><a href="index.html#stories" class="btn btn--ink" style="align-self:flex-start">Watch Rob\'s films</a></div></div>'
      + '<div class="outline-card"><h2>Your story: the outline</h2>' + rows + '<div class="orow"><b>Suggested film</b><span style="font-weight:600">' + film + (state.unsure ? ' (Rob will confirm the best fit)' : '') + '</span></div></div></div>');
    node.querySelectorAll('#when .pill').forEach(function (p) {
      p.addEventListener('click', function () { node.querySelectorAll('#when .pill').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); p.setAttribute('aria-pressed', 'true'); });
    });
    node.querySelector('#edit').addEventListener('click', function () { state.i = 0; save(); question(true); });
    node.querySelector('#send').addEventListener('submit', function (e) {
      e.preventDefault();
      // TODO: post state.a + contact details to Rob's form handler or CRM once chosen
      state.contact = Object.fromEntries(new FormData(e.target)); state.sent = true; save();
      node.classList.add('is-sent');
    });
    swap(node);
  }

  if (state.sent) { state = { path: null, unsure: false, i: -1, a: {} }; save(); }
  if (state.i >= 0 && state.path) question(false); else startScreen();
})();
</script>
</body>
</html>
