<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 265" role="img" aria-label="ITM">
  <title>ITM</title>
  <!--
    The ITM mark, vectorised from the official high-resolution store lockup
    (itm.co.nz store artwork, 1892x371). Geometry measured to the pixel, not redrawn
    by eye. Key characteristics of the real mark, all preserved here:
      - solid black slab band across the top, which is simultaneously the t crossbar
        and the top of the m
      - the dot of the i is a YELLOW CIRCLE KNOCKED OUT of that band, not a black dot
      - single rounded corner, top-right of the m only (r 11); everything else square
      - three m legs and two notches, all exactly 69 and 17 units wide
      - registered mark bottom right, outside the letterforms
    This is a reproduction for layout use. Request the official vector from ITM support
    services before build - see enrichment/_quality.yml gap G1.
  -->
  <rect width="494" height="265" fill="#FEF200"/>
  <g fill="#231F20">
    <!-- top slab: t crossbar + m top, one continuous band -->
    <rect x="39" y="44" width="413" height="53"/>
    <!-- i stem -->
    <rect x="40" y="111" width="69" height="114"/>
    <!-- t stem, joined to the band above -->
    <rect x="126" y="96" width="69" height="129"/>
    <!-- m: rounded top-right corner, three legs, two notches -->
    <path d="M211 111 h230 a11 11 0 0 1 11 11 v103 h-69 v-91 h-17 v91 h-69 v-91 h-17 v91 h-69 z"/>
  </g>
  <!-- the i dot: knocked out of the slab -->
  <circle cx="74" cy="70" r="24.8" fill="#FEF200"/>
  <!-- registered mark -->
  <g transform="translate(471 213)">
    <circle r="11.5" fill="none" stroke="#231F20" stroke-width="3"/>
    <path fill="#231F20" d="M-4.6 6.2V-6.2h5.2c2.6 0 4.2 1.4 4.2 3.7 0 1.7-.9 2.9-2.4 3.4L5.2 6.2H2.3L.2 1.4h-2.3v4.8zm2.5-7h2.4c1.1 0 1.8-.6 1.8-1.6S4.4-4 3.3-4H-2.1z"/>
  </g>
</svg>
