<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3940.42 704.00" role="img" aria-label="Acorn ITM">
  <title>Acorn ITM</title>
  <desc>wordmark in ITM yellow - for dark backgrounds</desc>
  <!--
    The full Acorn ITM lockup as ARTWORK, not live text.
    The viewBox is the ink box: the top and bottom of the ACORN letterforms and of the yellow
    ITM panel are all exactly y=0 and y=704. Alignment is geometry, so it cannot drift with
    a slow webfont, a fallback face, or a browser's text metrics - which is what kept breaking
    it when the wordmark was set as live type.
    Proportions measured off the real artwork (Acorn-Logo.png, 378x68):
      panel height : wordmark height = 1.00
      gap          : lockup height   = 0.303
      ACORN width  : panel width     = 1.84   (tracking solved to 0.00669 em)
    Wordmark drawn from Saira Condensed 800 outlines, standing in for Klavika Bold (gap G8).
    The wordmark takes its colour from the parent via currentColor. The ITM panel is fixed
    yellow-and-ink and must never be recoloured.
  -->
